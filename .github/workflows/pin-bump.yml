name: Scanner pin bumps

# Once a month, one pull request per scanner whose newest release is at least
# seven days old and newer than its pin (scripts/pin-bump.mjs). The pinned
# table is the product's supply chain, so the work is split by trust:
# - plan and bump run with read access only and keep no git credentials. bump
#   moves the pin, checks every download, and runs the gate, which starts
#   the new scanner release: code from outside this repository.
# - open-pr holds the write token and runs no code from the repository or
#   from a scanner: it takes only toolchain.json, the lock files and the
#   changeset that bump handed over, commits them and opens the pull request.
# Nothing here merges or approves: a person reads the change and merges it.
on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Scanners with a bump due
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tools: ${{ steps.plan.outputs.tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: plan
        run: echo "tools=$(node scripts/pin-bump.mjs --matrix)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  bump:
    name: Bump ${{ matrix.tool }}
    needs: plan
    if: needs.plan.outputs.tools != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tool: ${{ fromJSON(needs.plan.outputs.tools) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # golangci-lint needs Go on PATH for the end-to-end tests.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Move the pin
        env:
          TOOL: ${{ matrix.tool }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # uv for re-locking a PyPI scanner: the pinned one, checked against
          # its sha256 by the OpenQodex installer.
          export OPENQODEX_HOME="$RUNNER_TEMP/openqodex-home"
          UV="$(node -e 'import("./packages/scanners/dist/index.js").then(async (m) => process.stdout.write((await m.installTool("uv")).path))')"
          export UV
          node scripts/pin-bump.mjs --apply "$TOOL"
      - name: Check every pinned download
        run: node scripts/refresh-toolchain.mjs --verify
      - name: Gate
        id: gate
        continue-on-error: true
        env:
          OPENQODEX_E2E_HOME: ${{ runner.temp }}/openqodex-e2e-home
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/gate.sh
      - name: Hand over the changed files
        env:
          TOOL: ${{ matrix.tool }}
          GATE: ${{ steps.gate.outcome }}
        run: |
          out="$RUNNER_TEMP/pin-bump"
          mkdir -p "$out/packages/scanners/locks" "$out/.changeset"
          cp packages/scanners/toolchain.json "$out/packages/scanners/"
          for f in packages/scanners/locks/"${TOOL}"-*.txt .changeset/pin-"${TOOL}"-*.md; do
            if [ -f "$f" ]; then cp "$f" "$out/$f"; fi
          done
          version="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("packages/scanners/toolchain.json", "utf8")).tools[process.argv[1]].version)' "$TOOL")"
          printf '{"tool":"%s","version":"%s","gate":"%s"}\n' "$TOOL" "$version" "$GATE" > "$out/bump.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pin-bump-${{ matrix.tool }}
          path: ${{ runner.temp }}/pin-bump
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  open-pr:
    name: Open the pull request for ${{ matrix.tool }}
    needs: [plan, bump]
    if: ${{ !cancelled() && needs.plan.outputs.tools != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tool: ${{ fromJSON(needs.plan.outputs.tools) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pin-bump-${{ matrix.tool }}
          path: ${{ runner.temp }}/pin-bump
      - name: Commit and open the pull request
        env:
          TOOL: ${{ matrix.tool }}
          GH_TOKEN: ${{ github.token }}
        run: |
          in="$RUNNER_TEMP/pin-bump"
          # Only these files cross from the job that ran outside code, each a
          # regular file: the table, this scanner's lock files, its changeset.
          allowed="^(bump\.json|packages|packages/scanners|packages/scanners/toolchain\.json|packages/scanners/locks|packages/scanners/locks/${TOOL}-[a-z0-9-]+\.txt|\.changeset|\.changeset/pin-${TOOL}-[0-9-]+\.md)$"
          bad="$(find "$in" -mindepth 1 \( -type d -o -type f \) -printf '%P\n' | grep -v -E "$allowed" || true)"
          links="$(find "$in" -mindepth 1 ! -type f ! -type d -printf '%P\n')"
          if [ -n "$bad" ] || [ -n "$links" ]; then
            echo "::error title=Pin bump::unexpected files from the bump job: ${bad}${links}"
            exit 1
          fi
          named="$(jq -r .tool "$in/bump.json")"
          version="$(jq -r .version "$in/bump.json")"
          gate="$(jq -r .gate "$in/bump.json")"
          if [ "$named" != "$TOOL" ] || ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error title=Pin bump::bump.json names ${named} ${version}"
            exit 1
          fi
          branch="pin-bump/${TOOL}-${version}"
          if git ls-remote --exit-code origin "refs/heads/${branch}" > /dev/null; then
            echo "A pull request branch for ${TOOL} ${version} already exists."
            exit 0
          fi
          cp "$in/packages/scanners/toolchain.json" packages/scanners/toolchain.json
          if [ -d "$in/packages/scanners/locks" ]; then cp "$in"/packages/scanners/locks/* packages/scanners/locks/ 2> /dev/null || true; fi
          cp "$in"/.changeset/pin-*.md .changeset/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add packages/scanners/toolchain.json packages/scanners/locks .changeset
          git commit -m "Move the ${TOOL} pin to ${version}"
          git push origin "$branch"
          if [ "$gate" = "success" ]; then result="passed"; else result="failed; read its log in this workflow run before merging"; fi
          body="The built-in ${TOOL} scanner moves to ${version}, its newest release at least seven days old. Each download's sha256 was computed from the downloaded file and matched the sha256 the project and GitHub publish for it. The gate ran on this change in the workflow that opened this pull request: ${result}. CI does not start on a pull request a workflow opens: push a commit, or close and reopen it, to run CI. Read the change in findings before merging; nothing merges or approves this automatically."
          gh pr create --base main --head "$branch" --title "Move the ${TOOL} pin to ${version}" --body "$body"
