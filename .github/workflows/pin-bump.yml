name: Scanner pin bumps

# Once a month, one pull request per scanner whose newest release is at least
# seven days old and newer than its pin (scripts/pin-bump.mjs). Each pull
# request carries the new pin with its sha256, the lock file for a PyPI or
# RubyGems scanner, a changeset, and the result of the gate run on it here.
# Nothing here merges: a person reads the change in findings and merges.
on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Scanners with a bump due
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.plan.outputs.tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: plan
        run: echo "tools=$(node scripts/pin-bump.mjs --matrix)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  bump:
    name: Bump ${{ matrix.tool }}
    needs: plan
    if: needs.plan.outputs.tools != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tool: ${{ fromJSON(needs.plan.outputs.tools) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # golangci-lint needs Go on PATH for the end-to-end tests.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Move the pin
        id: bump
        env:
          TOOL: ${{ matrix.tool }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # uv for re-locking a PyPI scanner: the pinned one, checked against
          # its sha256 by the OpenQodex installer.
          export OPENQODEX_HOME="$RUNNER_TEMP/openqodex-home"
          UV="$(node -e 'import("./packages/scanners/dist/index.js").then(async (m) => process.stdout.write((await m.installTool("uv")).path))')"
          export UV
          node scripts/pin-bump.mjs --apply "$TOOL"
          version="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("packages/scanners/toolchain.json", "utf8")).tools[process.argv[1]].version)' "$TOOL")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=pin-bump/${TOOL}-${version}" >> "$GITHUB_OUTPUT"
      - name: Check every pinned download
        run: node scripts/refresh-toolchain.mjs --verify
      - name: Gate
        id: gate
        continue-on-error: true
        env:
          OPENQODEX_E2E_HOME: ${{ runner.temp }}/openqodex-e2e-home
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/gate.sh
      - name: Open the pull request
        env:
          TOOL: ${{ matrix.tool }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          GATE: ${{ steps.gate.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" > /dev/null; then
            echo "A pull request branch for ${TOOL} ${VERSION} already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add packages/scanners/toolchain.json packages/scanners/locks .changeset
          git commit -m "Move the ${TOOL} pin to ${VERSION}"
          git push origin "$BRANCH"
          if [ "$GATE" = "success" ]; then result="passed"; else result="failed; read its log in this workflow run before merging"; fi
          body="The built-in ${TOOL} scanner moves to ${VERSION}, its newest release at least seven days old. The sha256 of every download is pinned and was checked against the download. The gate ran on this change in the workflow that opened this pull request: ${result}. CI does not start on a pull request a workflow opens: push a commit, or close and reopen it, to run CI. Read the change in findings before merging; nothing merges this automatically."
          gh pr create --base main --head "$BRANCH" --title "Move the ${TOOL} pin to ${VERSION}" --body "$body"
