name: Outside benchmark image

# Builds the outside benchmark's linux/amd64 image and proves it: every
# built-in scanner installed and reporting its check case, and a build
# without Ruby or without Rust refused, naming the scanners that need it.
# Started by hand only. Nothing is pushed to a registry.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build and check the image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Three builds: the full image, one without Ruby, one without Rust.
      - name: Build the image and check every scanner is ready
        run: bash benchmark/outside/image/check-build.sh
        env:
          REQUIRE_DOCKER: "1"
          OUT: ${{ runner.temp }}/outside-image
      # The preinstall lines of each build, for reading after the run.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: outside-image-logs
          path: ${{ runner.temp }}/outside-image
          if-no-files-found: ignore
