name: Release

# On every push to main, changesets/action does one of two things:
# - when changesets are waiting, it opens or updates the "Version packages"
#   pull request, which bumps the version and writes CHANGELOG.md;
# - when that pull request has merged and no changeset is left, it publishes
#   the new version to npm with provenance, tags it and makes a GitHub release.
# Nothing else runs this workflow: not pull requests, not other branches.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    if: github.repository == 'openqodex/openqodex'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Version pull request or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Bumps the version, writes CHANGELOG.md and rewrites every pinned
          # openqodex@<version> in the skill, the plugin, the Action and the
          # pre-commit hook, so the gate's version check passes.
          version-script: pnpm version-packages
          # Builds, runs the gate, then publishes with pnpm, which rewrites
          # workspace: links in the published package.json.
          publish-script: pnpm release
          commit-message: Version packages
          pr-title: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
