name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # golangci-lint needs Go on PATH; the end-to-end tests fail in CI when
      # any scanner is skipped.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # golangci-lint 2.12.2 is built with Go 1.26 and cannot check a newer Go.
          go-version: "1.26"
          cache: false
      # cargo-deny needs Cargo, and the macOS runner image has no Rust
      # toolchain; the end-to-end tests fail in CI when any scanner is missing.
      - if: runner.os == 'macOS'
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
      - run: pnpm install --frozen-lockfile
      # The end-to-end tests install the pinned scanners once into this folder.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openqodex-e2e-home
          key: scanners-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/scanners/toolchain.json', 'packages/scanners/locks/**') }}
      # The steps below mirror scripts/gate.sh one for one.
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      # Only the two test steps get the token: the custom scanner tests read a
      # release from the GitHub API, and hosted runners share addresses, so the
      # anonymous rate limit is often spent. Install and build never see it.
      - name: Unit tests
        run: pnpm test
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          OPENQODEX_E2E_HOME: ${{ runner.temp }}/openqodex-e2e-home
          GITHUB_TOKEN: ${{ github.token }}
      # The review of the demo's planted change with both reviewer drivers,
      # compared file by file with tests/golden/expected.
      - name: Golden run
        run: pnpm golden:check
      - name: Skill and plugin manifests
        run: node scripts/validate-skill.mjs
      - name: Config docs
        run: node scripts/config-docs.mjs --check
      - name: Private material scrub
        run: node scripts/scrub.mjs

  # The scanner-only benchmark on the frozen planted cases with every
  # scanner installed, two passes on one build, and its trend gate against
  # the accepted scanner-only run in benchmark/index. It fails when the two
  # passes differ, or when the score moved against the accepted run and the
  # index does not hold the new number (benchmark/trend.mjs --against-run).
  # scripts/gate.sh does not run it: it needs Ruby and Go.
  bench-scan:
    name: Scanner-only benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The scanners' install root, and the folder the artifact is made of.
      # The runs lie inside the checkout (benchmark/results is ignored by
      # git) because a score names its run folder relative to the repository
      # only when the folder is in it; outside it the score holds the
      # runner's home path, and publish-run.mjs refuses to package it.
      - name: Name the folders
        run: |
          echo "OPENQODEX_HOME=$RUNNER_TEMP/openqodex-bench-home" >> "$GITHUB_ENV"
          echo "BENCH=$GITHUB_WORKSPACE/benchmark/results/bench-scan" >> "$GITHUB_ENV"
      # The pull request's own head, not the merge commit GitHub makes: the
      # run's build commit becomes the commit of an index entry when the run
      # is accepted, and a merge commit is not kept once the pull request
      # closes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Node, Ruby, Go, the build and every scanner, cached: the one recipe
      # this job and bench-weekly.yml share.
      - uses: ./.github/actions/bench-setup
      - name: Scan the planted cases twice
        run: |
          run_id="$(date -u +%Y-%m-%d)-$(git rev-parse --short=7 HEAD)-planted-scan-ci"
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"
          node benchmark/run.mjs --mode scan --check-identical --out "$BENCH/results/$run_id"
      - name: Trend against the accepted run
        if: ${{ !cancelled() && env.RUN_ID != '' }}
        run: node benchmark/trend.mjs --mode scan --against-run "$BENCH/results/$RUN_ID" --summary "$GITHUB_STEP_SUMMARY"
      # The entry a person commits to accept this run (benchmark/trend.mjs
      # --accept), written from the run folder the artifact holds.
      - name: Write the run's index entry
        if: ${{ !cancelled() && env.RUN_ID != '' }}
        run: |
          node benchmark/publish-run.mjs "$BENCH/results/$RUN_ID" --dry-run --write-index --out "$BENCH/asset"
          mkdir -p "$BENCH/index/runs"
          cp "benchmark/index/runs/$RUN_ID.json" "$BENCH/index/runs/"
          {
            echo ""
            echo "The run folders and this index entry are in the artifact bench-scan-$RUN_ID, kept 14 days. \`gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --name bench-scan-$RUN_ID --dir <dir>\` puts the run folder at \`<dir>/results/$RUN_ID\`, so \`<results>\` above is \`<dir>/results\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && env.RUN_ID != '' }}
        with:
          name: bench-scan-${{ env.RUN_ID }}
          path: benchmark/results/bench-scan
          retention-days: 14
          if-no-files-found: error
