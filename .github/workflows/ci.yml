name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # golangci-lint needs Go on PATH; the end-to-end tests fail in CI when
      # any scanner is skipped.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # golangci-lint 2.12.2 is built with Go 1.26 and cannot check a newer Go.
          go-version: "1.26"
          cache: false
      - run: pnpm install --frozen-lockfile
      # The end-to-end tests install the pinned scanners once into this folder.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openqodex-e2e-home
          key: scanners-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/scanners/toolchain.json') }}
      # The steps below mirror scripts/gate.sh one for one.
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          OPENQODEX_E2E_HOME: ${{ runner.temp }}/openqodex-e2e-home
          # The custom scanner case reads a release from the GitHub API. Hosted
          # runners share addresses, so the anonymous rate limit is often spent.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Skill and plugin manifests
        run: node scripts/validate-skill.mjs
      - name: Private material scrub
        run: node scripts/scrub.mjs
