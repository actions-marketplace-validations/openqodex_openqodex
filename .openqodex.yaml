# OpenQodex's own config for this repository.
version: 1
review:
  paths:
    # These folders hold bugs planted on purpose: the demo repository, the
    # scanner test fixtures and the review benchmark's cases (and the saved
    # reviews of them). A review of this repository must not report them.
    exclude:
      - examples/demo-repo/**
      - packages/scanners/test/fixtures/**
      - benchmark/cases/**
      - benchmark/results/**
